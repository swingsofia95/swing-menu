<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWING — Bar Menu</title>
<meta name="description" content="SWING bar menu — cocktails, the back bar, wine, beer, shots and snacks. Swingin' since '95.">
<meta name="theme-color" content="#660033">
<meta property="og:title" content="SWING — Bar Menu">
<meta property="og:description" content="Cocktails, the back bar, wine, beer, shots and snacks. Swingin' since '95.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://menu.swingsofia.com/">
<meta property="og:image" content="https://menu.swingsofia.com/assets/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23660033'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23F63719'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column on a burgundy ground; sticky chip nav; sections stacked.
   Single committed brand look (same as the printed menu), so one theme only. */
:root{
  --bg:#660033;
  --bg-deep:#4D0026;
  --fg:#FFFCF1;
  --fg-soft:rgba(255,252,241,.78);
  --fg-mute:rgba(255,252,241,.62);
  --accent:#F63719;
  --rule:rgba(255,252,241,.16);
  --ink:#1F000F;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav-h:56px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--body);
  font-size:18px;
  line-height:1.25;
  min-height:100%;
  position:relative;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.grain{position:fixed;inset:0;background:url(assets/grain-dark.png) repeat;background-size:240px 240px;opacity:.07;pointer-events:none;z-index:0}
.wrap{
  position:relative;z-index:1;
  max-width:640px;margin:0 auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
  padding-block:0 56px;
}
a{color:var(--fg)}a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Header */
.hero{position:relative;overflow:hidden;padding-block:28px 14px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hero .logo{width:min(46vw,184px);height:auto;display:block}
.eyebrow{font:500 11.5px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-soft)}
.hero .since{display:block;width:min(60vw,268px);height:auto;margin:26px 0 0 3%;transform:rotate(-5deg);position:relative;z-index:1}
.hero .sax{position:absolute;right:-14px;top:78px;height:196px;width:auto;transform:rotate(14deg);pointer-events:none}
.hero .tag{margin-top:30px;display:flex;flex-direction:column;gap:2px;max-width:66%}
.hero .tag .sub{font:italic 400 14px/1.2 var(--display);font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 14;color:var(--fg-mute)}
@media (min-width:480px){.hero .sax{right:0;height:230px;top:70px}.hero .since{margin-top:30px}}

/* Sticky section nav */
.nav{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--bg);
  margin-left:calc(-1*max(20px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1*max(20px,env(safe-area-inset-right,0px)));
  border-bottom:1px solid var(--rule);
}
.nav::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.nav ul{
  list-style:none;margin:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding-block:9px;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
  scroll-padding-inline:20px;
}
.nav ul::-webkit-scrollbar{display:none}
.nav a{
  display:inline-flex;align-items:center;height:36px;padding:0 13px;white-space:nowrap;
  border:1.5px solid var(--rule);border-radius:999px;text-decoration:none;
  font:600 15px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--fg);
}
.nav a[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.nav a:hover{border-color:var(--fg)}

/* Sections */
main{display:flex;flex-direction:column;gap:44px;padding-top:28px}
section{scroll-margin-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 8px)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:16px}
.sec-head h2{margin:0;font:900 38px/1 var(--display);font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 144;letter-spacing:-.01em;color:var(--accent);text-wrap:balance}
.sec-head .note{font:500 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-soft);text-align:right;max-width:46%}
.kicker{display:block;font:500 11.5px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-mute);margin-bottom:6px}
.groups{display:grid;grid-template-columns:1fr;gap:22px}
@media (min-width:600px){
  .groups[data-cols="2"]{display:block;columns:2;column-gap:36px}
  .groups[data-cols="2"] .group{display:block;margin-bottom:22px}
  .groups[data-cols="2"] .group h3{break-after:avoid;margin-bottom:10px}
  .groups[data-cols="2"] .item{break-inside:avoid;margin-bottom:10px}
}
.group{display:flex;flex-direction:column;gap:10px;min-width:0}
.group h3{margin:0 0 2px;display:flex;align-items:center;gap:10px;font:700 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--fg)}
.group h3::before{content:"";display:block;width:16px;height:3px;background:var(--accent)}
.item{display:flex;flex-direction:column;gap:3px;min-width:0}
.item .row{display:flex;align-items:center;gap:12px;min-height:26px}
.item .name{font:600 20px/1.15 var(--body);color:var(--fg);min-width:0}
.item .spacer{flex:1 1 auto;min-width:12px}
.item .price{font:500 20px/1.15 var(--body);font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.item .desc{font:italic 400 14.5px/1.3 var(--display);font-variation-settings:'SOFT' 50,'opsz' 12;color:var(--fg-soft)}
.pick{position:relative;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;margin:-10px 0;transform:rotate(-10deg);flex:0 0 auto}
.pick img{position:absolute;inset:0;width:46px;height:46px}
.pick span{position:relative;font:700 9.5px/1.05 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-align:center}

/* Footer */
footer{margin-top:56px;border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:18px}
footer .logo{width:96px;height:auto;display:block}
footer .tag{display:flex;flex-direction:column;gap:2px}
footer .tag .sub{font:italic 400 14px/1.2 var(--display);font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 14;color:var(--fg-mute)}
footer .meta{font:500 11px/1.7 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-mute)}
footer .horn{align-self:flex-end;height:96px;width:auto;transform:rotate(-8deg);margin-top:-40px}

/* Error state (only shows if menu.js is broken) */
.err{display:none;margin:24px 0;padding:16px;border:2px solid var(--accent);font:500 16px/1.4 var(--body)}
.err code{font-family:var(--mono);font-size:13px}
.err.show{display:block}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="wrap">

  <header class="hero">
    <div class="top">
      <img class="logo" src="assets/logo-cream.svg" alt="SWING" width="184" height="52">
      <span class="eyebrow">Bar menu</span>
    </div>
    <img class="since" src="assets/since95-cream.svg" alt="Swingin' since '95" width="300" height="178">
    <img class="sax" src="assets/sax.svg" alt="" aria-hidden="true">
    <div class="tag">
      <span class="eyebrow" id="tagline"></span>
      <span class="sub" id="tagline-sub"></span>
    </div>
  </header>

  <nav class="nav" aria-label="Menu sections"><ul id="nav"></ul></nav>

  <div class="err" id="err" role="alert">
    The menu couldn't load. <code>menu.js</code> probably has a typo (a missing comma or quote). The last good version is on GitHub — restore it, or ask Claude to fix the line.
  </div>

  <main id="menu"></main>

  <footer>
    <img class="logo" src="assets/logo-cream.svg" alt="SWING" width="96" height="27">
    <div class="tag">
      <span class="eyebrow" id="tagline-2"></span>
      <span class="sub" id="tagline-sub-2"></span>
    </div>
    <div class="meta">Prices in EUR · spirits 40 ml unless noted · updated <span id="updated"></span> · <a href="https://swingsofia.com/privacy.html">Privacy</a></div>
    <img class="horn" src="assets/horn.svg" alt="" aria-hidden="true">
  </footer>

</div>

<script src="menu.js"></script>
<script src="assets/tracking.js" defer></script>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=2666180403597236&amp;ev=PageView&amp;noscript=1"></noscript>
<script>
(function(){
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var fmt=function(p){ if(typeof p==='number'){ return (Math.round(p*100)/100).toString(); } return esc(p); };
  var fmtDate=function(iso){ try{ var d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return iso; } };

  try{
    var M=window.SWING_MENU;
    if(!M||!M.sections||!M.sections.length) throw new Error('no menu');

    ['tagline','tagline-2'].forEach(function(id){document.getElementById(id).textContent=M.tagline||'';});
    ['tagline-sub','tagline-sub-2'].forEach(function(id){document.getElementById(id).textContent=M.taglineSub||'';});
    document.getElementById('updated').textContent=fmtDate(M.updated||'');

    var nav=[], html=[];
    M.sections.forEach(function(s){
      nav.push('<li><a href="#'+esc(s.id)+'" data-id="'+esc(s.id)+'">'+esc(s.title)+'</a></li>');
      var cols=(s.groups&&s.groups.length>1)?'2':'1';
      var g=(s.groups||[]).map(function(gr){
        var items=(gr.items||[]).map(function(it){
          var badge=it.pick?'<span class="pick" aria-label="House pick"><img src="assets/starburst.svg" alt=""><span>House<br>pick</span></span>':'';
          var desc=it.desc?'<div class="desc">'+esc(it.desc)+'</div>':'';
          return '<div class="item"><div class="row"><span class="name">'+esc(it.name)+'</span>'+badge+'<span class="spacer"></span><span class="price">'+fmt(it.price)+'</span></div>'+desc+'</div>';
        }).join('');
        return '<div class="group">'+(gr.title?'<h3>'+esc(gr.title)+'</h3>':'')+items+'</div>';
      }).join('');
      html.push(
        '<section id="'+esc(s.id)+'" aria-labelledby="h-'+esc(s.id)+'">'+
          (s.kicker?'<span class="kicker">'+esc(s.kicker)+'</span>':'')+
          '<div class="sec-head"><h2 id="h-'+esc(s.id)+'">'+esc(s.title)+'</h2>'+(s.note?'<span class="note">'+esc(s.note)+'</span>':'')+'</div>'+
          '<div class="groups" data-cols="'+cols+'">'+g+'</div>'+
        '</section>');
    });
    document.getElementById('nav').innerHTML=nav.join('');
    document.getElementById('menu').innerHTML=html.join('');

    /* scroll-spy: highlight the chip for the section in view and keep it visible in the strip */
    var links=[].slice.call(document.querySelectorAll('#nav a'));
    var byId={}; links.forEach(function(a){byId[a.getAttribute('data-id')]=a;});
    var current=null, strip=document.getElementById('nav');
    var setActive=function(id){
      if(id===current) return; current=id;
      links.forEach(function(a){ if(a.getAttribute('data-id')===id){a.setAttribute('aria-current','true');}else{a.removeAttribute('aria-current');} });
      var a=byId[id]; if(a){ var target=a.offsetLeft - (strip.clientWidth - a.offsetWidth)/2; strip.scrollTo({left:Math.max(0,target),behavior:'smooth'}); }
    };
    if('IntersectionObserver' in window){
      var visible={};
      var io=new IntersectionObserver(function(entries){
        entries.forEach(function(e){ visible[e.target.id]=e.isIntersecting; });
        var first=M.sections.map(function(s){return s.id;}).filter(function(id){return visible[id];})[0];
        if(first) setActive(first);
      },{rootMargin:'-72px 0px -60% 0px',threshold:0});
      M.sections.forEach(function(s){ var el=document.getElementById(s.id); if(el) io.observe(el); });
    }
    links.forEach(function(a){ a.addEventListener('click',function(){ setTimeout(function(){setActive(a.getAttribute('data-id'));},50); }); });
  }catch(e){
    document.getElementById('err').className='err show';
    if(window.console) console.error(e);
  }
})();
</script>
</body>
</html>
